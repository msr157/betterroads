worker_processes  auto;
error_log         /var/log/nginx/error.log warn;
pid               /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    server {
        listen       80;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # Security headers — internal tool: never framed, never indexed
        add_header X-Frame-Options        "DENY"                     always;
        add_header X-Content-Type-Options "nosniff"                  always;
        add_header Referrer-Policy        "no-referrer"              always;
        add_header X-Robots-Tag           "noindex, nofollow"        always;

        # Cache static assets aggressively (immutable — hash-named in build output)
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires     1y;
            add_header  Cache-Control "public, immutable";
            access_log  off;
        }

        # Health check endpoint — used by the Docker HEALTHCHECK and Dokploy
        location /health {
            access_log  off;
            return 200  '{"status":"ok","service":"betterroads-dashboard"}';
            add_header  Content-Type application/json;
        }

        # SPA fallback — serve index.html for all unmatched routes
        location / {
            try_files   $uri $uri/ /index.html;
        }

        # Block hidden files (e.g. .env, .git)
        location ~ /\. {
            deny all;
            access_log    off;
            log_not_found off;
        }
    }
}
