services:
  betterroads:
    image: betterroads:latest
    build: { context: ., dockerfile: Dockerfile }
    container_name: betterroads
    restart: unless-stopped
    ports: ["80:80"]
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_NAME=${APP_NAME:-betterroads}
      - DOMAIN=${DOMAIN:-betterroads.local}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.betterroads.rule=Host(`${DOMAIN:-betterroads.local}`)"
      - "traefik.http.routers.betterroads.entrypoints=websecure"
      - "traefik.http.routers.betterroads.tls=true"
      - "traefik.http.services.betterroads.loadbalancer.server.port=80"
    networks: [betterroads-net]
  collection-storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: betterroads-collection-storage
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${COLLECTION_S3_ACCESS_KEY_ID:-betterroads-local}
      MINIO_ROOT_PASSWORD: ${COLLECTION_S3_SECRET_ACCESS_KEY:-betterroads-local-development-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - collection-storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [betterroads-net]
  collection-storage-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      collection-storage:
        condition: service_healthy
    environment:
      COLLECTION_S3_ACCESS_KEY_ID: ${COLLECTION_S3_ACCESS_KEY_ID:-betterroads-local}
      COLLECTION_S3_SECRET_ACCESS_KEY: ${COLLECTION_S3_SECRET_ACCESS_KEY:-betterroads-local-development-secret}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://collection-storage:9000 "$${COLLECTION_S3_ACCESS_KEY_ID}" "$${COLLECTION_S3_SECRET_ACCESS_KEY}" &&
        mc mb --ignore-existing local/betterroads-sensor-data &&
        mc anonymous set none local/betterroads-sensor-data
    restart: "no"
    networks: [betterroads-net]
  collection-db:
    image: postgres:16-alpine
    container_name: betterroads-collection-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-betterroads}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-betterroads-local-development-secret}
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-betterroads}
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - collection-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [betterroads-net]
networks:
  betterroads-net:
    driver: bridge
    name: betterroads-net
volumes:
  collection-storage-data:
  collection-db-data:
