name: BetterRoads validation

on:
  push:
    branches: [main, qa, development]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install website and backend
        run: pnpm install --frozen-lockfile

      - name: Install standalone applications
        run: |
          npm ci --prefix dashboard
          npm ci --prefix mobile/app

      - name: Build and typecheck applications
        run: |
          pnpm --filter @betterroads/backend build
          pnpm --filter website build
          npm run build --prefix dashboard
          npm run typecheck --prefix mobile/app

      - name: Unit tests
        run: |
          pnpm --filter @betterroads/backend test
          npm test --prefix mobile/app

      - name: AI tests
        run: |
          python -m pip install -e "ai[test]"
          python -m pytest ai/tests

      - name: Production Docker builds
        run: |
          docker build -f Dockerfile -t betterroads-website:${{ github.sha }} .
          docker build -f backend/Dockerfile -t betterroads-backend:${{ github.sha }} backend
          docker build -f dashboard/Dockerfile -t betterroads-dashboard:${{ github.sha }} dashboard

      - name: Deployment handoff
        if: github.ref == 'refs/heads/main'
        run: echo "Dokploy deploys main through its configured GitHub webhooks."
